<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<header><div class="brand-label">Snippet Library<a class="github-sync" href="sync.html" aria-label="GitHub sync settings" title="GitHub sync settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297a12 12 0 0 0-3.797 23.385c.6.112.82-.258.82-.577v-2.234c-3.338.726-4.043-1.416-4.043-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.776.418-1.305.762-1.605-2.665-.3-5.467-1.334-5.467-5.93 0-1.31.468-2.38 1.235-3.22-.123-.303-.535-1.523.117-3.176 0 0 1.008-.322 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.873.12 3.176.77.84 1.233 1.91 1.233 3.22 0 4.61-2.807 5.625-5.48 5.92.43.372.823 1.102.823 2.222v3.293c0 .32.216.694.825.576A12.001 12.001 0 0 0 12 .297z"/></svg></a></div><h1>elearning.fastigiatalab.com</h1>

<main>
<h2 id="h">Add snippet</h2>
<div class="row">
  <form id="f" class="card">
    <label for="title">Title</label><input id="title" required>
    <label for="category">Category</label><input id="category" list="cats" placeholder="e.g. Callout, Layout, Table">
    <datalist id="cats"></datalist>
    <label for="tags">Tags</label><input id="tags" list="taglist" placeholder="#tafe #assessment #callout" autocomplete="off">
    <datalist id="taglist"></datalist>
    <label for="notes">Notes</label><input id="notes">
    <label for="html">HTML</label><textarea id="html" required></textarea>
    <button>Save snippet</button><a class="btn secondary" href="index.html">Cancel</a>
  </form>
  <div class="card"><h3>Live preview</h3><div id="checks"></div><iframe id="p" title="Preview"></iframe></div>
</div>
</main>
<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
const editing = param('id') ? store.get(param('id')) : null;
$('cats').innerHTML = [...new Set(store.all().map(s => s.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('');
$('taglist').innerHTML = [...new Set(store.all().flatMap(s => s.tags || []))].map(t => `<option value="#${esc(t)}">`).join('');
if (editing) { $('h').textContent = 'Edit snippet'; ['title', 'category', 'notes', 'html'].forEach(k => $(k).value = editing[k] || ''); $('tags').value = (editing.tags || []).map(t => '#' + t).join(' '); }
function update() { $('checks').innerHTML = renderChecks(checkHtml($('html').value)); preview($('p'), $('html').value); }
$('html').addEventListener('input', update); update();
$('f').onsubmit = e => {
  e.preventDefault();
  store.upsert({ id: editing ? editing.id : newId(), title: $('title').value.trim(), category: $('category').value.trim(), tags: parseTags($('tags').value), notes: $('notes').value.trim(), html: $('html').value });
  location.href = 'index.html';
};
</script></body></html>
