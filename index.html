<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>elearning.fastigiatalab.com</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand-label">Snippet Library<a class="github-sync" href="sync.html" aria-label="GitHub sync settings" title="GitHub sync settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297a12 12 0 0 0-3.797 23.385c.6.112.82-.258.82-.577v-2.234c-3.338.726-4.043-1.416-4.043-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.776.418-1.305.762-1.605-2.665-.3-5.467-1.334-5.467-5.93 0-1.31.468-2.38 1.235-3.22-.123-.303-.535-1.523.117-3.176 0 0 1.008-.322 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.873.12 3.176.77.84 1.233 1.91 1.233 3.22 0 4.61-2.807 5.625-5.48 5.92.43.372.823 1.102.823 2.222v3.293c0 .32.216.694.825.576A12.001 12.001 0 0 0 12 .297z"/></svg></a></div><h1>elearning.fastigiatalab.com</h1>
<nav><a href="index.html">Library</a><a href="add.html">Add snippet</a><a href="test.html">Test</a><a href="embed.html">Embed</a><a href="projects.html">Projects</a><a href="guide.html">Guide</a><a href="https://fastigiatalab.com">Lab</a></nav></header>
<main>
<div class="card">
  <div class="row">
    <input id="q" placeholder="Search snippets…" aria-label="Search">
    <select id="tagsel" aria-label="Filter by tag"></select>
  </div>
  <button id="export" class="secondary">Export JSON</button>
  <label class="btn secondary" style="font-weight:normal">Import JSON<input id="import" type="file" accept=".json" hidden></label>
</div>
<p id="syncstat" class="intro" style="font-size:.8rem"></p>
<div id="list"></div>
</main>
<script src="app.js"></script>
<script>
const list = document.getElementById('list'), q = document.getElementById('q'), tagsel = document.getElementById('tagsel');
function fillTags() {
  const all = store.all(), cur = tagsel.value;
  const counts = {};
  all.forEach(s => (s.tags || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
  tagsel.innerHTML = '<option value="">All tags</option>' + Object.keys(counts).sort()
    .map(t => `<option value="${esc(t)}">#${esc(t)} (${counts[t]})</option>`).join('');
  tagsel.value = counts[cur] ? cur : '';
}
function render() {
  fillTags();
  const t = q.value.toLowerCase();
  const items = store.all().filter(s => (!tagsel.value || (s.tags || []).includes(tagsel.value)) && (s.title + s.category + s.notes + s.html + (s.tags || []).map(t => ' #' + t).join('')).toLowerCase().includes(t));
  list.innerHTML = items.map(s => `<div class="card snippet-card">
    <div class="snippet-content">
      <div class="snippet-tags"><span class="tag">${esc(s.category || 'Uncategorised')}</span>
      ${(s.tags || []).map(t => `<button class="tag utag" data-tag="${esc(t)}" title="Filter by #${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <h3>${esc(s.title)}</h3>
      <div class="snippet-actions">
        <button data-copy="${esc(s.id)}">Copy HTML</button>
        <a class="btn secondary" href="test.html?id=${encodeURIComponent(s.id)}">Test</a>
        <a class="btn secondary" href="add.html?id=${encodeURIComponent(s.id)}">Edit</a>
        <button class="secondary" data-share="${esc(s.id)}">Share</button>
        <button class="danger" data-del="${esc(s.id)}">Delete</button>
      </div>
    </div>
    <p class="snippet-description">${esc(s.notes)}</p>
  </div>`).join('') || '<p>No snippets yet. <a href="add.html">Add one</a>.</p>';
}
list.addEventListener('click', e => {
  const c = e.target.dataset.copy, d = e.target.dataset.del, tg = e.target.dataset.tag, sh = e.target.dataset.share;
  if (sh) shareLink(store.get(sh)).then(url => {
    copyText(url, e.target);
    if (url.length > 8000) alert('This link is very long and may not work in some apps. Consider sharing the HTML directly.');
  });
  if (tg) { tagsel.value = tg; render(); }
  if (c) copyText(store.get(c).html, e.target);
  if (d && confirm('Delete this snippet?')) { store.remove(d); render(); }
});
q.addEventListener('input', render);
tagsel.addEventListener('change', render);
document.getElementById('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(store.all(), null, 2)], { type: 'application/json' }));
  a.download = 'moodle-snippets.json'; a.click();
};
document.getElementById('import').onchange = async e => {
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(data)) throw 0;
    data.filter(s => s && s.title && s.html).forEach(s => store.upsert({ ...s, id: s.id || newId() }));
    render();
  } catch { alert('Invalid snippet file.'); }
};
document.addEventListener('snippets-synced', render);
function showStatus() {
  const s = JSON.parse(localStorage.getItem('moodleSafeSyncStatus') || 'null');
  document.getElementById('syncstat').textContent = s ? (s.ok ? '' : '⚠ ') + 'Sync: ' + s.msg : '';
}
document.addEventListener('sync-status', showStatus); showStatus();
render();
</script></body></html>
